<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="grid">
            <div class="item1">
                <h3>From:</h3>
                <input type="text" id="from" placeholder="Currency">
            </div>
            <div class="item2">
                <h3>Value:</h3>
                <input type="number" id="val" placeholder="Value">
            </div>
            <div class="item3">
                <h3>To:</h3>
                <input type="text" id="to" placeholder="Currency">
            </div>
            <div class="item4">
                <button id="but">Convert</button>
                <h2 id="show">--</h2>
            </div>
        </div>
    </main>
    
<script src="env.js"></script>
<script src="script.js"></script>
</body>
</html>
